<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Yapılacaklar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Yapılacaklar</h1>
  <p id="counter"></p>

  <form id="task-form">
    <input id="task-input" type="text" placeholder="Yeni görev..." autocomplete="off">
    <button type="submit">Ekle</button>
  </form>
  <div id="filters">
      <button id="filter-all">Hepsi</button>
      <button id="filter-active">Yapılacaklar</button>
      <button id="filter-done">Tamamlananlar</button>
    </div>

  <ul id="task-list"></ul>
  <h2>Arşiv</h2>
  <ul id="archive-list"></ul>

  <script src="app.js"></script>
</body>
</html>
